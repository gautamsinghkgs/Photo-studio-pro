# =============================================================================
#  WHY THIS FILE IS THE MOST VALUABLE THING IN THE REPO
# =============================================================================
#  The environment this project was written in has no Android SDK, no Gradle,
#  only JDK 11 (AGP 8.13 needs 17), 2 GB of RAM and no /dev/kvm. So NOT ONE LINE
#  of the 55 Kotlin files has ever been through a real Android compile.
#
#  GitHub's runners have JDK 17, the Android SDK and 7 GB of RAM. Pushing this
#  repo gives you a machine that CAN compile it — for free, without a credit
#  card, and it hands you the exact first error instead of you having to
#  install and configure Android Studio first.
#
#  Cost: free. Public repos = unlimited minutes. Private repos = 2,000
#  minutes/month, and one Android build is roughly 5-10 minutes, so ~200+
#  builds a month. You will not come close.
#
#  `resources` runs first and gates the rest: a duplicate string name or a broken
#  R.string reference fails in ~10 seconds instead of after a 10-minute Gradle run.
#  Then `compile`, `test` and `release` run IN PARALLEL and are deliberately
#  independent, so a failure in one never hides the result of another.
#
#  On a first run, expect `compile` to fail. That is the point: read the FIRST
#  error, not the last twenty.
# =============================================================================
name: build

on:
  push:
  workflow_dispatch:

# One build at a time per branch. Android builds are slow and a stale run
# burning 10 minutes tells you nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # AGP 8.13.x requires JDK 17. Not 11, not 21-by-default.
  JAVA_TOOL_OPTIONS: -Xmx3g
  # Keep Gradle's own daemon heap below the runner's 7 GB so the Kotlin compiler
  # does not get OOM-killed mid-run.
  ORG_GRADLE_PROJECT_org.gradle.jvmargs: -Xmx3g -XX:MaxMetaspaceSize=768m
  GRADLE_VERSION: "8.13"

jobs:
  # ---------------------------------------------------------------------------
  # JOB 0 — fail in ~10 seconds, before Gradle ever starts.
  #
  # A duplicate resource name makes aapt2 fail deep inside a 10-minute build with
  # an error that does not name the line. One such duplicate (`<string name="cancel">`
  # declared twice) was actually shipped in this repo and would have broken the
  # very first build. These checks need only the Python standard library, so they
  # run on any branch and cost nothing.
  # ---------------------------------------------------------------------------
  resources:
    name: Resource lint (no Android SDK needed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check resources
        run: |
          python3 tools/check_resources.py
          python3 tools/check_wiring.py

  # ---------------------------------------------------------------------------
  # JOB 1 — does it compile at all? This is the real gate on a first run.
  # ---------------------------------------------------------------------------
  compile:
    name: Compile (assembleDebug)
    needs: resources
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          curl -fsSL -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Ensure Android SDK platform 36 + build tools
        run: |
          # Runners ship the SDK with licences already accepted. Install
          # explicitly so a missing platform surfaces as a clear error here
          # rather than as a confusing AGP failure later.
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # The Firebase plugins are commented out in app/build.gradle.kts until a
      # real google-services.json exists. If you have uncommented them but not
      # added the file, this keeps CI green on the parts that are not your
      # Firebase setup. Remove this step once the real file is committed
      # (or better: never commit it, and keep the plugins off in CI).
      - name: Provide a placeholder google-services.json if one is missing
        run: |
          if [ ! -f app/google-services.json ]; then
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": { "package_name": "com.photostudio.pro" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON
            echo "::notice::Wrote a placeholder google-services.json for CI only."
          fi

      - name: Assemble debug
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload the APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # JOB 2 — the 117 unit tests. These already pass on a plain JVM; this proves
  # they still pass inside a real Gradle + Android build.
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    needs: resources
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          curl -fsSL -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Ensure Android SDK platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon
      # The HTML report names every failing test and shows the assertion
      # message, which is far easier to read than the console tail.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # JOB 3 — the actual shippable artifact, plus the two Play gates that are
  # easy to forget and impossible to fix after a rejection.
  # ---------------------------------------------------------------------------
  release:
    name: Release AAB + Play gates
    needs: resources
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          curl -fsSL -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Ensure Android SDK platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Provide a placeholder google-services.json if one is missing
        run: |
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"000000000000","project_id":"ci-placeholder","storage_bucket":"ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.photostudio.pro"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' \
              > app/google-services.json
          fi

      # Unsigned on purpose: keystore.properties is git-ignored, and
      # app/build.gradle.kts only attaches the release signing config when that
      # file exists. An unsigned AAB is still fully valid for these checks.
      - name: Bundle release AAB
        run: gradle bundleRelease --stacktrace --no-daemon

      # ⚠️ PLAY GATE 1 — 16 KB page size, mandatory with targetSdk 36 from
      # 31 Aug 2026. ML Kit ships native .so models, so this is a real risk
      # here and not a formality.
      - name: Verify 16 KB page alignment
        run: |
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          echo "Checking $AAB"
          "$ANDROID_HOME"/build-tools/36.0.0/zipalign -c -P 16 -v 4 "$AAB"

      # ⚠️ PLAY GATE 2 — 64-bit. A 32-bit-only build is rejected outright.
      - name: Verify 64-bit native libraries
        run: |
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          mkdir -p /tmp/aab && cd /tmp/aab && unzip -qo "$GITHUB_WORKSPACE/$AAB"
          if ls base/lib/*/ 2>/dev/null | grep -q .; then
            echo "Native ABIs present:"; ls base/lib/
            if [ ! -d base/lib/arm64-v8a ]; then
              echo "::error::No arm64-v8a — Play requires 64-bit."; exit 1
            fi
          else
            echo "No native libs in the base module (models arrive via Play services)."
          fi

      # The ~33 MB estimate in SPEC.md 7.4 has never been measured. This is
      # where the real number comes from. If it exceeds 70 MB, stop and do not
      # add more models.
      - name: Report download size
        run: |
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          echo "AAB size: $(du -h "$AAB" | cut -f1)"
          echo "SPEC.md 7.4 estimated ~33 MB. Update that file with this real number."

      - name: Upload the AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
