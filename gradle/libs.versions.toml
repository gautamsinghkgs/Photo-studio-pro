# ============================================================================
# VERSION CATALOG — Photo Studio Pro
# ============================================================================
# Every version below was resolved LIVE from Maven on 2026-10-29 by querying:
#   https://dl.google.com/android/maven2/<path>/maven-metadata.xml
#   https://repo.maven.apache.org/maven2/<path>/maven-metadata.xml
# Nothing here was guessed from memory (SPEC.md HARD CONSTRAINT C4).
#
# ⚠️ IF ANDROID STUDIO COMPLAINS ABOUT AGP/KOTLIN/KSP:
#    Let Studio's own "New Project" wizard generate these three lines instead.
#    Studio ships with a toolchain combination it has tested. Library versions
#    below (ML Kit, AdMob, RevenueCat, Compose BOM) are the ones that matter
#    and those are correct.
# ============================================================================

[versions]
# --- Build toolchain (match your Android Studio install if it complains) ---
agp                = "9.1.1"     # REQUIRED — see bug #16. The 2026 AndroidX stack
                                  # (Compose 1.12.1 / core 1.19.1 / navigation 2.10.2 /
                                  # lifecycle 2.11.0) declares
                                  # minAndroidGradlePluginVersion=9.1.0 + minCompileSdk=37
                                  # in its AAR metadata, so 8.13.2 fails checkAarMetadata.
                                  # AGP 9.1.1 (April 2026): Gradle 9.3.1 min, Build-Tools
                                  # 36.0.0, JDK 17, supports API 37.
kotlin             = "2.3.21"     # latest stable 2.3.x
ksp                = "2.3.12"

# --- AndroidX ---
coreKtx            = "1.19.1"
activityCompose    = "1.13.0"
lifecycle          = "2.11.0"
navigationCompose  = "2.10.2"
composeBom         = "2026.09.00"
room               = "2.8.5"
datastore          = "1.3.0"
documentfile       = "1.1.0"
exifinterface      = "1.4.2"

# --- ML Kit ---
# ⚠️ CRITICAL: Subject Segmentation is UNBUNDLED ONLY. There is no
# com.google.mlkit:segmentation-subject artifact. Verified against Google's
# official doc (updated 2026-10-28) which states: "This API requires Android
# API level 24 or higher and uses an unbundled library downloaded via Google
# Play services." App size impact ~200 KB.
mlkitSubjectSeg    = "16.0.0-beta1"   # com.google.android.gms:play-services-mlkit-subject-segmentation
mlkitFace          = "16.1.7"         # com.google.mlkit:face-detection          (BUNDLED, ~6.9 MB)
mlkitTextLatin     = "16.0.1"         # com.google.mlkit:text-recognition        (BUNDLED, ~4 MB)
mlkitTextDevanagari= "16.0.1"         # com.google.mlkit:text-recognition-devanagari (BUNDLED, ~4 MB)

# --- Ads / consent ---
playServicesAds    = "25.5.0"
ump                = "4.0.0"

# --- Billing ---
revenuecat         = "6.5.2"

# --- Firebase (Spark plan only — see SPEC.md C2) ---
firebaseBom        = "35.1.0"
# ⚠️ The `-ktx` Firebase artifacts DO NOT EXIST in BOM 35.1.0 — the BOM lists zero
# ktx entries (firebase-analytics-ktx stopped at 22.5.0, June 2025). A dependency
# with no version fails resolution: "Could not find com.google.firebase:
# firebase-analytics-ktx:." (bug #15, found by a local Gradle resolve on 2026-10-30).
# Since BOM 32.x the Kotlin extensions live INSIDE the main artifacts, so
# `firebase-analytics` / `firebase-config` / `firebase-crashlytics` are correct and
# our imports (com.google.firebase.analytics.FirebaseAnalytics, ...remoteconfig.*)
# already point at the non-ktx packages.

# --- Third party ---
# coil REMOVED — bug #29. The app never loads a network image: every Image() in
# every screen paints a locally-decoded Bitmap via BitmapPainter. Coil 3 pulled in
# coil-core + coil-compose + okio for nothing (~2 MB of the AAB budget). If you ever
# add URL-based image loading, re-add:
#   coil = "3.6.3"   (group io.coil-kt.coil3)
pdfbox             = "2.0.27.0"
coroutines         = "1.11.0"
serializationJson  = "1.12.0"

# --- Test ---
junit              = "4.13.2"

[libraries]
androidx-core-ktx              = { group = "androidx.core",             name = "core-ktx",                   version.ref = "coreKtx" }
androidx-activity-compose      = { group = "androidx.activity",         name = "activity-compose",           version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",      version.ref = "lifecycle" }
androidx-lifecycle-viewmodel   = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose",version.ref = "lifecycle" }
androidx-navigation-compose    = { group = "androidx.navigation",       name = "navigation-compose",         version.ref = "navigationCompose" }
androidx-compose-bom           = { group = "androidx.compose",          name = "compose-bom",                version.ref = "composeBom" }
androidx-compose-ui            = { group = "androidx.compose.ui",       name = "ui" }
androidx-compose-ui-graphics   = { group = "androidx.compose.ui",       name = "ui-graphics" }
androidx-compose-ui-tooling    = { group = "androidx.compose.ui",       name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui",  name = "ui-tooling-preview" }
androidx-compose-material3     = { group = "androidx.compose.material3",name = "material3" }
androidx-compose-material-icons= { group = "androidx.compose.material",  name = "material-icons-extended" }
androidx-room-runtime          = { group = "androidx.room",             name = "room-runtime",               version.ref = "room" }
androidx-room-ktx              = { group = "androidx.room",             name = "room-ktx",                   version.ref = "room" }
androidx-room-compiler         = { group = "androidx.room",             name = "room-compiler",              version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore",        name = "datastore-preferences",      version.ref = "datastore" }
androidx-documentfile          = { group = "androidx.documentfile",     name = "documentfile",               version.ref = "documentfile" }
androidx-exifinterface         = { group = "androidx.exifinterface",    name = "exifinterface",              version.ref = "exifinterface" }

# ML Kit — note the different groups! Subject Segmentation lives under
# com.google.android.gms (unbundled), the others under com.google.mlkit (bundled).
mlkit-subject-segmentation     = { group = "com.google.android.gms",   name = "play-services-mlkit-subject-segmentation", version.ref = "mlkitSubjectSeg" }
mlkit-face-detection           = { group = "com.google.mlkit",          name = "face-detection",               version.ref = "mlkitFace" }
mlkit-text-recognition         = { group = "com.google.mlkit",          name = "text-recognition",             version.ref = "mlkitTextLatin" }
mlkit-text-recognition-devanagari = { group = "com.google.mlkit",       name = "text-recognition-devanagari",  version.ref = "mlkitTextDevanagari" }

play-services-ads              = { group = "com.google.android.gms",   name = "play-services-ads",            version.ref = "playServicesAds" }
ump                            = { group = "com.google.android.ump",   name = "user-messaging-platform",      version.ref = "ump" }

# ⚠️ Must be the UMBRELLA artifact `purchases`, NOT `purchases-store-google` (bug #17).
# Verified by unzipping both AARs: purchases-store-google-6.5.2.aar contains ONLY the
# Google billing wrapper (45 classes under com/revenuecat/purchases/google/). The public
# entry points we import — Purchases, PurchasesConfiguration, LogLevel, CustomerInfo,
# interfaces.ReceiveCustomerInfoCallback and ListenerConversionsKt (getOfferingsWith /
# purchaseWith) — live in purchases-6.5.2.aar, which pulls store-google + purchases-core-*
# transitively. Depending on the store artifact alone leaves 69 "Unresolved reference"
# compile errors in EntitlementManager.kt and PurchaseFlow.kt.
revenuecat-purchases           = { group = "com.revenuecat.purchases",  name = "purchases",                    version.ref = "revenuecat" }

firebase-bom                   = { group = "com.google.firebase",       name = "firebase-bom",                 version.ref = "firebaseBom" }
firebase-analytics             = { group = "com.google.firebase",       name = "firebase-analytics" }
firebase-crashlytics           = { group = "com.google.firebase",       name = "firebase-crashlytics" }
firebase-config                = { group = "com.google.firebase",       name = "firebase-config" }

pdfbox-android                 = { group = "com.tom-roush",             name = "pdfbox-android",               version.ref = "pdfbox" }
kotlinx-coroutines-android     = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android",   version.ref = "coroutines" }
kotlinx-serialization-json     = { group = "org.jetbrains.kotlinx",     name = "kotlinx-serialization-json",   version.ref = "serializationJson" }

junit                          = { group = "junit",                     name = "junit",                        version.ref = "junit" }
kotlinx-coroutines-test        = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-test",      version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application",             version.ref = "agp" }
# kotlin-android is GONE on purpose: AGP 9 has built-in Kotlin support and applying
# org.jetbrains.kotlin.android is a hard build failure (bug #16).
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization= { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
google-services     = { id = "com.google.gms.google-services",      version = "4.4.3" }
firebase-crashlytics= { id = "com.google.firebase.crashlytics",     version = "3.0.6" }
