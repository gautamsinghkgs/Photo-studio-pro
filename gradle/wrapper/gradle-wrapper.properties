# Gradle 8.13 = the documented minimum AND default for AGP 8.13.x.
# Verified 2026-10-30 against developer.android.com/build/releases/agp-8-13-0-release-notes
# (page last updated 2026-10-28): Gradle min 8.13, JDK 17, SDK Build Tools 35.0.0.
#
# ⚠️ gradlew / gradlew.bat / gradle-wrapper.jar are NOT in this project.
#    The .jar is a binary and cannot be written as text. Generate all three with
#    either of these, once:
#      a) open the project in Android Studio and let it sync (it creates them), or
#      b) run:  gradle wrapper --gradle-version 8.13
#    The CI workflow in .github/workflows/ci.yml does NOT need them — it installs
#    Gradle 8.13 directly, so CI works before you ever generate the wrapper.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
